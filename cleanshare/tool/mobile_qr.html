<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZeroTrace — Mobile test QR</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0a0f0a;
      color: #f5f5f5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 420px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(120, 255, 180, 0.2);
      border-radius: 20px;
      padding: 28px 24px 32px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 8px;
      font-weight: 600;
    }
    p {
      margin: 0 0 20px;
      color: #b8c4b8;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    img {
      width: 280px;
      height: 280px;
      border-radius: 12px;
      background: #fff;
      padding: 8px;
      margin-bottom: 16px;
    }
    code {
      display: block;
      word-break: break-all;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #9dffc8;
    }
    ul {
      text-align: left;
      color: #a8b4a8;
      font-size: 0.85rem;
      margin: 20px 0 0;
      padding-left: 1.2rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Scan with your phone</h1>
    <p>Open ZeroTrace in your mobile browser. Phone and PC must be on the same Wi‑Fi.</p>
    <img id="qr" alt="QR code for mobile test URL" width="280" height="280" />
    <code id="url"></code>
    <ul>
      <li>Keep the Flutter terminal running on your PC.</li>
      <li>Allow Windows Firewall if prompted.</li>
      <li>Use Chrome or Safari on your phone.</li>
    </ul>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get("url") || "http://localhost:7357";
    document.getElementById("url").textContent = url;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" +
      encodeURIComponent(url);
  </script>
</body>
</html>
