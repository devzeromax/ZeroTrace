name: cleanshare
description: ZeroTrace — privacy-first file sanitization. Detect and remove risks locally.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.4
  file_picker: ^8.1.7
  share_plus: ^12.0.2
  video_player: ^2.9.2
  lottie: ^3.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  ffi: ^2.1.3
  http: ^1.2.2
  archive: ^4.0.2
  uuid: ^4.5.1
  exif: ^3.3.0
  universal_io: ^2.2.2
  rive: ^0.14.8
  zxing2: ^0.2.4
  image: ^4.9.1
  cryptography: ^2.7.0
  permission_handler: ^11.4.0
  liquid_glass_widgets: ^0.21.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  shared_preferences_platform_interface: ^2.4.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#000000"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
    - assets/lottie/
    - assets/rive/
    - assets/onboarding/
    - assets/processing/
    - assets/marketplace/
    - assets/marketplace/packs/
    - assets/samples/
